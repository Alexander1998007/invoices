services:
  db:
    image: mysql:8.4
    container_name: invoice_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invoices
      MYSQL_USER: invoice
      MYSQL_PASSWORD: invoice
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: invoice_backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: invoices
      DB_USERNAME: invoice
      DB_PASSWORD: invoice
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["/usr/local/bin/docker-entrypoint.sh"]

  frontend:
    image: node:24-bookworm-slim
    container_name: invoice_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NUXT_API_BASE_INTERNAL: http://backend:8000/api
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
